name: checks
on: [push, pull_request]
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.lock -e backend
      - run: PYTHONPATH=backend .venv/bin/python -m pytest backend/tests -q
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npx playwright test && npx playwright test --config playwright.offline.config.ts
        working-directory: frontend
        env:
          EXTRACTION_PROVIDER: scripted
          PILOT_SIGNUP_APPROVAL_REQUIRED: 'false'
      - run: npm audit --audit-level=high
        working-directory: frontend
