[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftproof"
version = "0.1.0"
description = "Evidence-preserving voice handovers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "boto3>=1.38,<2", "mangum>=0.19,<1",
  "PyJWT[crypto]>=2.10,<3", "python-dotenv>=1,<2", "pwdlib[argon2]>=0.2,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["shiftproof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
